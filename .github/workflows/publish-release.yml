name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare release assets
        run: |
          mkdir dist
          install -m 755 target/release/solana-shred-tx-benchmark \
            dist/solana-shred-tx-benchmark-x86_64-unknown-linux-gnu
          cd dist
          sha256sum solana-shred-tx-benchmark-x86_64-unknown-linux-gnu \
            > solana-shred-tx-benchmark-x86_64-unknown-linux-gnu.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Determine and reserve release version
        id: version
        run: |
          case "$GITHUB_RUN_NUMBER" in
            '' | *[!0-9]*) echo "Invalid workflow run number" >&2; exit 1 ;;
          esac
          [ "$GITHUB_RUN_NUMBER" -gt 0 ] || { echo "Invalid workflow run number" >&2; exit 1; }
          tag="0.1.$((GITHUB_RUN_NUMBER - 1))"
          git fetch --force --tags origin
          existing=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$tag already points to another commit" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            git tag "$tag" "$GITHUB_SHA"
            if ! git push origin "refs/tags/$tag"; then
              git tag -d "$tag"
              git fetch --force --tags origin
              [ "$(git rev-list -n 1 "$tag" 2>/dev/null || true)" = "$GITHUB_SHA" ] || {
                echo "Unable to reserve $tag" >&2
                exit 1
              }
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --generate-notes
          fi
