name: Build release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare release assets
        run: |
          mkdir dist
          install -m 755 target/release/solana-shred-tx-benchmark \
            dist/solana-shred-tx-benchmark-x86_64-unknown-linux-gnu
          cd dist
          sha256sum solana-shred-tx-benchmark-x86_64-unknown-linux-gnu \
            > solana-shred-tx-benchmark-x86_64-unknown-linux-gnu.sha256
      - name: Reserve next patch version
        id: version
        run: |
          git fetch --force --tags origin
          tag=$(git tag --list '0.1.*' --points-at "$GITHUB_SHA" --sort=-v:refname | \
            awk '/^0\.1\.[0-9]+$/ { print; exit }')
          for attempt in 1 2 3 4 5; do
            [ -z "$tag" ] || break
            latest=$(git tag --list '0.1.*' --sort=-v:refname | \
              awk '/^0\.1\.[0-9]+$/ { print; exit }')
            if [ -z "$latest" ]; then
              tag=0.1.0
            else
              tag="0.1.$((${latest##*.} + 1))"
            fi
            git tag "$tag" "$GITHUB_SHA"
            if git push origin "refs/tags/$tag"; then
              break
            fi
            git tag -d "$tag"
            git fetch --force --tags origin
            if [ "$(git rev-list -n 1 "$tag" 2>/dev/null || true)" != "$GITHUB_SHA" ]; then
              tag=
            fi
          done
          [ -n "$tag" ] || { echo "Unable to reserve a release tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --generate-notes
          fi
